plugins { id 'net.fabricmc.fabric-loom' version '1.19.4' }
version = '1.5.3+26.2.initials.4'
repositories {
 maven { url 'https://maven.shedaniel.me/' }
 maven { url 'https://maven.terraformersmc.com/' }
}
dependencies {
 minecraft 'com.mojang:minecraft:26.2'
 implementation 'net.fabricmc:fabric-loader:0.20.1'
 implementation 'me.shedaniel.cloth:cloth-config-fabric:26.2.155'
 compileOnly 'com.terraformersmc:modmenu:20.0.3'
}
sourceSets.main.java.srcDirs = ['common/src/main/java','fabric/src/main/java']
sourceSets.main.resources.srcDirs = ['common/src/main/resources','fabric/src/main/resources']
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version, cloth_version: '26.2.155') } }
jar { archiveClassifier = 'fabric'; from 'LICENSE' }
